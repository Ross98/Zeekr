<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>充电进度设计预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182b3a;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums}main{max-width:1160px;margin:48px auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:28px;margin:0 0 9px}p{color:#526575;margin:0;line-height:1.6}.badge{background:#e7edf2;color:#405766;padding:8px 13px;border-radius:8px}.panel{background:white;border:1px solid #dbe3e9;border-radius:14px;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.head h2{font-size:20px;margin:0 0 8px}.state{color:#15734e;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(4,1fr);padding:27px 0 25px;border-bottom:1px solid #e2e8ed;margin-bottom:23px}.metrics span{display:block;color:#526575;font-size:14px;margin-bottom:8px}.metrics strong{font-size:27px;font-weight:600}.metrics small{font-size:15px;font-weight:400;margin-left:5px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}.legend{display:flex;gap:24px}label{display:flex;align-items:center;gap:7px;cursor:pointer}input{accent-color:#215fd0}.swatch{width:22px;height:3px;background:#2166d1}.green{background:#19805d}.target{background:#788896;height:0;border-top:2px dashed #788896}.hint{font-size:13px;color:#526575}.graph{position:relative}svg{display:block;width:100%;overflow:visible}svg text{font-family:inherit;font-size:12px;fill:#526575}.reading{display:flex;gap:23px;flex-wrap:wrap;padding:15px 18px;background:#f0f5fa;border-radius:8px;margin-top:10px;font-size:14px}.reading b{font-weight:600}.foot{margin-top:18px;font-size:13px;color:#526575}.below{display:flex;justify-content:space-between;margin-top:24px;align-items:center}button{font:inherit;color:#254c73;background:#fff;border:1px solid #b7c8d7;border-radius:8px;padding:9px 15px;cursor:pointer}button:hover{background:#edf4fa}button:focus-visible,input:focus-visible{outline:3px solid #87b0eb;outline-offset:3px}::selection{background:#d2e4fc}#extra{display:none;margin-top:18px;background:#edf3f7;padding:18px;border-radius:8px;line-height:1.7}@media(max-width:700px){main{margin:24px auto;padding:0 16px}header{align-items:flex-start;gap:12px}h1{font-size:24px}.badge{font-size:12px}.panel{padding:18px}.metrics{grid-template-columns:1fr 1fr;gap:22px}.metrics strong{font-size:24px}.toolbar{align-items:flex-start;flex-direction:column}.legend{gap:15px;font-size:13px}.head{align-items:flex-start}.head p{font-size:12px}.reading{gap:10px 18px}.below{gap:12px}svg text{font-size:14px}}</style>
<main><header><div><h1>充电进度</h1><p>电量与功率，同一时间看清变化。</p></div><span class="badge">设计预览 · 合成数据</span></header><section class="panel"><div class="head"><div><h2>本次充电 <span class="state">· 观测为直流充电中</span></h2><p>10 月 03 日 14:08 开始观测 · 缓存更新于 14:44</p></div></div><div class="metrics"><div><span>当前观测电量</span><strong>68<small>%</small></strong></div><div><span>当前观测功率</span><strong>58.6<small>kW</small></strong></div><div><span>已观测时长</span><strong>36<small>分钟</small></strong></div><div><span>预计剩余</span><strong style="font-size:21px">未提供</strong></div></div><div class="toolbar"><div class="legend"><label><input type="checkbox" checked data-series="power"><i class="swatch"></i>功率</label><label><input type="checkbox" checked data-series="soc"><i class="swatch green"></i>电量</label><label><input type="checkbox" checked data-series="target"><i class="swatch target"></i>目标 80%</label></div><span class="hint">左右双轴 · 移动游标查看同一时刻</span></div><div class="graph"><svg id="chart" viewBox="0 0 1000 350" role="img" aria-label="合成充电曲线，蓝色功率左轴，绿色电量右轴，14:24至14:32缺少采样"></svg></div><div class="reading" aria-live="polite"><b id="stamp">14:36</b><span>功率 <b id="watts">76.0 kW</b></span><span>电量 <b id="battery">60%</b></span><span id="sample">已保存的观测点</span></div><p class="foot">14:24–14:32 缺少采样，曲线断开。目标 80% 为演示值；正式页面仅在来源可靠时显示。</p><div class="below"><p class="hint">功率为观测计算值；电量为车辆缓存 SOC。</p><button id="expand" aria-expanded="false">查看其他参数</button></div><div id="extra">温度、电压、电流建议放在下方独立小图，共用时间游标。此预览仅展示功率与电量，不补造参数读数。</div></section></main>
<script>
const pts=[[0,32,32],[4,95,37],[8,108,41],[12,102,46],[16,94,50],[20,null,null],[24,83,56],[28,76,60],[32,67,64],[36,58.6,68]],svg=document.querySelector('svg');let pick=7;const x=t=>65+t/36*865,yP=v=>290-v/120*240,yS=v=>290-v/100*240;function draw(){let s='';for(let i=0;i<=4;i++){let y=290-i*60;s+=`<path d="M65 ${y}H930" stroke="#e3e9ef"/><text x="48" y="${y+4}" text-anchor="end">${i*30}</text><text x="948" y="${y+4}">${i*25}%</text>`}s+='<text x="65" y="22">功率 kW</text><text x="930" y="22" text-anchor="end">电量 SOC</text>';for(let t=0;t<=36;t+=8)s+=`<text x="${x(t)}" y="324" text-anchor="middle">14:${String(8+t).padStart(2,'0')}</text>`;s+=`<text x="${x(36)}" y="324" text-anchor="middle">14:44</text><rect x="${x(16)}" y="50" width="${x(24)-x(16)}" height="240" fill="#eef1f4"/><text x="${x(20)}" y="180" text-anchor="middle" transform="rotate(-90 ${x(20)} 180)">缺少采样</text>`;if(document.querySelector('[data-series=target]').checked)s+=`<path d="M65 ${yS(80)}H930" stroke="#788896" stroke-dasharray="6 5"/><text x="922" y="${yS(80)-8}" text-anchor="end">目标 80%</text>`;for(const [key,index,color,y]of[['power',1,'#2166d1',yP],['soc',2,'#19805d',yS]]){if(!document.querySelector(`[data-series=${key}]`).checked)continue;let d='',prev=null;pts.forEach(p=>{if(p[index]==null){prev=null;return}d+=prev?(index===2?`H${x(p[0])}V${y(p[index])}`:`L${x(p[0])} ${y(p[index])}`):`M${x(p[0])} ${y(p[index])}`;prev=p});s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;let p=pts[pick];if(p[index]!=null)s+=`<circle cx="${x(p[0])}" cy="${y(p[index])}" r="5" fill="white" stroke="${color}" stroke-width="3"/>`}s+=`<path d="M${x(pts[pick][0])} 50V290" stroke="#526575" stroke-dasharray="3 4"/>`;svg.innerHTML=s;let p=pts[pick];document.querySelector('#stamp').textContent='14:'+String(8+p[0]).padStart(2,'0');document.querySelector('#watts').textContent=p[1]==null?'未知':p[1].toFixed(1)+' kW';document.querySelector('#battery').textContent=p[2]==null?'未知':p[2]+'%';document.querySelector('#sample').textContent=p[1]==null?'此时缺少采样':'已保存的观测点'}document.querySelectorAll('input').forEach(e=>e.onchange=draw);svg.onpointermove=e=>{let r=svg.getBoundingClientRect(),t=((e.clientX-r.left)/r.width*1000-65)/865*36;pick=pts.reduce((best,p,i)=>Math.abs(p[0]-t)<Math.abs(pts[best][0]-t)?i:best,0);draw()};document.querySelector('#expand').onclick=e=>{let open=e.target.getAttribute('aria-expanded')==='true';e.target.setAttribute('aria-expanded',!open);e.target.textContent=open?'查看其他参数':'收起其他参数';document.querySelector('#extra').style.display=open?'none':'block'};draw();
</script></html>
