name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DESKTOP_ONLY: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: Asia/Shanghai

jobs:
  workflow:
    name: Workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Actions configuration with pinned actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  macos:
    name: macOS native tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test native macOS interfaces and release adapter
        run: python -m unittest discover -s tests -p 'test_macos*.py'

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run Python suite
        run: python -m unittest discover -s tests

  desktop:
    name: Desktop tests
    runs-on: ubuntu-24.04
    env:
      BROWSER_ARTIFACT_DIR: test-results/browser-failures
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate desktop test inventory
        run: npm run check:desktop-manifest
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Use the locked Chromium in every browser check
        run: node -e "console.log('CHROMIUM_EXECUTABLE=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Run JavaScript unit checks
        run: npm run test:unit
      - name: Run desktop browser checks
        run: npm run test:desktop
      - name: Upload browser evidence and per-file results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/browser-failures/*/page.png
            test-results/browser-failures/*/diagnostic.json
            test-results/browser-failures/*/trace.zip
            test-results/desktop/*.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
